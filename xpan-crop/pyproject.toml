[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpan-crop"
version = "0.1.0"
description = "65:24 (XPan) framing model, composition overlays and non-destructive crop for Fujifilm X100V files"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["Pillow>=11,<14"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xpan-crop = "xpan_crop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
